<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VD Transport AS - Truck Route Planner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #02689d;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --success-hover: #059669;
            --purple-color: #8b5cf6;
            --purple-hover: #7c3aed;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: var(--bg-color); 
            color: var(--text-color); 
        }

        .app-container { 
            display: grid; 
            grid-template-columns: 460px 1fr; 
            gap: 20px; 
            align-items: start; 
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 950px) {
            .app-container { grid-template-columns: 1fr; }
        }

        #sidebar { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            border: 1px solid var(--border-color);
        }

        h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 4px 0; color: var(--text-color); }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }

        .input-group { position: relative; margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-color); }
        
        .departure-wrapper { display: flex; gap: 6px; }
        .departure-wrapper input[type="text"] { flex-grow: 1; }
        
        .btn-gps { 
            background: var(--text-muted); color: white; border: none; padding: 0 12px; 
            font-size: 0.85rem; border-radius: 6px; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; font-weight: 500;
        }
        .btn-gps:hover { background: #475569; }

        input[type="text"], input[type="number"] { 
            width: 100%; box-sizing: border-box; padding: 10px; 
            border: 1px solid var(--border-color); border-radius: 6px; 
            font-size: 0.9rem; background: #fff; color: var(--text-color);
        }
        input[type="text"]:focus, input[type="number"]:focus { outline: none; border-color: var(--primary-color); }
        
        .search-row { display: flex; gap: 8px; align-items: stretch; }
        .search-row input[type="text"] { flex: 1; }

        .custom-select-wrapper { position: relative; width: 36px; user-select: none; flex-shrink: 0; }
        .custom-select-trigger {
            display: flex; align-items: center; justify-content: center;
            padding: 4px; background: #fff; border: 1px solid var(--border-color);
            border-radius: 6px; cursor: pointer; height: 100%; box-sizing: border-box;
        }
        .custom-select-trigger::after { content: "▼"; font-size: 5px; color: var(--text-muted); margin-left: 1px; }
        .custom-options {
            position: absolute; bottom: 105%; left: 0; right: 0; background: #fff;
            border: 1px solid var(--border-color); border-radius: 6px;
            box-shadow: 0 -10px 15px -3px rgba(0,0,0,0.1); display: none; z-index: 9999;
        }
        .custom-options.open { display: block; }
        .custom-option {
            display: flex; align-items: center; justify-content: center;
            padding: 6px; cursor: pointer; border-bottom: 1px solid var(--border-color);
        }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background: #f1f5f9; }

        .package-input-wrapper { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 0 6px; width: 85px; flex-shrink: 0; box-sizing: border-box; }
        .package-input-wrapper input { border: none; padding: 8px 0; width: 52px; text-align: center; font-size: 0.85rem; background: transparent; font-weight: bold; color: #ef4444; }
        .package-input-wrapper input:focus { outline: none; }

        .suggestions-box {
            position: absolute; bottom: 100%; left: 0; right: 0;
            background: white; border: 1px solid var(--border-color); border-bottom: none;
            border-radius: 6px 6px 0 0; max-height: 180px; overflow-y: auto; z-index: 9999;
            box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.1);
        }
        .suggestion-item { padding: 10px; font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .suggestion-item:hover { background: #f1f5f9; }
        .suggestion-item.db-match { background: #e0f2fe; color: #0369a1; font-weight: 500; }

        .btn-primary { 
            background: var(--success-color); color: white; border: none; 
            padding: 10px 16px; font-size: 0.9rem; font-weight: 500; border-radius: 6px; 
            cursor: pointer; width: 100%; margin-top: 6px; transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--success-hover); }

        .list-header-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            margin: 10px 0; background: #f1f5f9; padding: 8px 12px;
            border-radius: 6px; border: 1px solid var(--border-color);
        }
        .list-header-actions { display: flex; align-items: center; gap: 6px; }
        
        .btn-icon-action {
            background: #ffffff; color: var(--text-color); border: 1px solid var(--border-color);
            padding: 4px 8px; font-size: 0.85rem; font-weight: bold; border-radius: 4px;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .btn-icon-action:hover { background: #e2e8f0; border-color: #cbd5e1; }

        .btn-optimize-small {
            background: var(--purple-color); color: white; border: none; padding: 5px 8px;
            font-size: 0.8rem; font-weight: 600; border-radius: 4px; cursor: pointer;
        }
        .btn-optimize-small:hover { background: var(--purple-hover); }

        .btn-clear-all {
            background: var(--danger-color); color: white; border: none; padding: 5px 8px;
            font-size: 0.8rem; font-weight: 600; border-radius: 4px; cursor: pointer; display: none;
        }
        .btn-clear-all:hover { background: var(--danger-hover); }

        #addressListContainer { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        
        .address-item { 
            display: flex; flex-direction: column;
            background: #fff; padding: 8px 12px; border-radius: 6px; 
            border: 1px solid var(--border-color); font-size: 0.85rem; 
            user-select: none; transition: background 0.2s;
        }
        .address-item.is-loaded { border-left: 4px solid var(--success-color); }
        
        .address-main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 6px; }
        .address-content { display: flex; align-items: center; gap: 6px; flex-grow: 1; overflow: hidden; }
        .address-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; width: 100%; }
        
        .station-badge-btn {
            background: #0284c7; color: white; border: none; border-radius: 50%;
            width: 16px; height: 16px; font-size: 0.65rem; font-weight: bold;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; transition: background 0.2s;
        }
        .station-badge-btn:hover { background: #02689d; }

        .station-matched-info {
            font-size: 0.75rem; color: #0369a1; background: #e0f2fe; border: 1px solid #bae6fd;
            border-radius: 4px; padding: 4px 8px; margin-top: 6px; margin-left: 24px;
            display: none; align-items: center; gap: 4px;
        }
        .station-matched-info.visible { display: flex; }

        .move-buttons { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
        .btn-move {
            background: #f1f5f9; color: var(--text-color); border: 1px solid var(--border-color);
            width: 20px; height: 16px; border-radius: 3px; font-size: 0.65rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
            line-height: 1;
        }
        .btn-move:hover:not(:disabled) { background: #e2e8f0; border-color: #cbd5e1; }
        .btn-move:disabled { opacity: 0.3; cursor: default; }

        .drag-handle { color: #94a3b8; cursor: grab; font-weight: bold; flex-shrink: 0; padding: 2px 2px; }
        .drag-handle:active { cursor: grabbing; }
        
        .btn-del { 
            background: var(--danger-color); color: white; border: none; width: 22px; height: 22px;
            border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0;
        }
        .btn-del:hover { background: var(--danger-hover); }

        .empty-hint { color: var(--text-muted); font-style: italic; font-size: 0.85rem; text-align: center; padding: 16px; }
        
        .route-summary-card {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 14px; font-size: 0.85rem; background: #fff; padding: 8px 12px;
            border-radius: 6px; border: 1px solid var(--border-color);
        }
        .gmaps-icon-link {
            display: inline-flex; align-items: center; justify-content: center;
            background: #4285f4; color: white; border-radius: 6px; padding: 6px;
            text-decoration: none; transition: background 0.2s; flex-shrink: 0;
        }
        .gmaps-icon-link:hover { background: #2563eb; }

        .status-box { margin-top: 14px; background: #f1f5f9; padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid var(--border-color); }
        
        @keyframes pulse-animation { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        .pulsing { animation: pulse-animation 1.2s infinite ease-in-out; color: var(--danger-color); font-weight: bold; }

        .stop-list { margin-top: 10px; background: #f8fafc; padding: 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid var(--border-color); line-height: 1.6; }
        
        .debug-box { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.75rem; max-height: 130px; overflow-y: auto; margin-top: 16px; }

        #right-column { display: flex; flex-direction: column; gap: 20px; }
        #map-container { background: var(--card-bg); padding: 12px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: 580px; display: flex; flex-direction: column; border: 1px solid var(--border-color); }
        #map { width: 100%; flex-grow: 1; border-radius: 8px; cursor: crosshair; }

        .map-popup-btn { background: var(--primary-color); color: white; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; width: 100%; margin-top: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="sidebar">
        <h1>VD Transport AS</h1>
        <div class="subtitle">Truck Route Planner</div>

        <div class="input-group">
            <label>Start / Depot</label>
            <div class="departure-wrapper">
                <input type="text" id="depotInput" value="VD Transport AS, Sørestrandvegen, 6220 Straumgjerde" oninput="handleDepotInput(this)">
                <button class="btn-gps" onclick="setDepartureToCurrentGPS()" title="Aktuelle GPS-Position verwenden">GPS</button>
            </div>
            <div id="depotSuggestions" class="suggestions-box"></div>
        </div>

        <div class="list-header-wrapper">
            <label style="margin-bottom:0;">Tour-Stopps & Via-Punkte</label>
            <div class="list-header-actions">
                <button class="btn-icon-action" onclick="saveTourToFile()" title="Tour in .tur-Datei speichern">💾</button>
                <button class="btn-icon-action" onclick="triggerLoadTour()" title="Tour aus .tur-Datei laden">📂</button>
                <input type="file" id="tourFileInput" accept=".tur,.json" style="display:none;" onchange="handleTourFileSelect(event)">
                <button class="btn-optimize-small" onclick="confirmAndAutoOptimize()" title="Route automatisch optimieren">⚡ Auto-Sort</button>
                <button id="clearAllBtn" class="btn-clear-all" onclick="removeAllAddresses()" title="Alle Stopps löschen">Clear</button>
            </div>
        </div>

        <div id="addressListContainer">
            <div class="empty-hint" id="emptyHint">Noch keine Stopps hinzugefügt. Nutze die Eingabe oder Rechtsklick auf die Karte.</div>
        </div>

        <div class="input-group" style="margin-top: 12px; margin-bottom: 6px;">
            <label>Neuen Stopp hinzufügen</label>
            <div class="search-row">
                <!-- 1. Stop-Typ -->
                <div class="custom-select-wrapper" id="stopTypeCustomSelect">
                    <div class="custom-select-trigger" onclick="toggleCustomDropdown()">
                        <span id="selectedIconLabel" style="display:flex; align-items:center; justify-content:center;">
                            <svg width="18" height="18" viewBox="0 0 15 15" fill="none"><path d="M1 5H10V11H1V5Z" fill="#2C3E50"/><path d="M10 7H12.5L14 9V11H10V7Z" fill="#2C3E50"/><circle cx="3.5" cy="12.5" r="1.3" fill="#1A252F"/><circle cx="8" cy="12.5" r="1.3" fill="#1A252F"/><circle cx="12" cy="12.5" r="1.3" fill="#1A252F"/><path d="M5.5 7.5V1.5M5.5 1.5L3.3 3.7M5.5 1.5L7.7 3.7" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </div>
                    <div class="custom-options" id="customDropdownOptions">
                        <div class="custom-option" onclick="selectStopType('load')" title="Laden">
                            <svg width="18" height="18" viewBox="0 0 15 15" fill="none"><path d="M1 5H10V11H1V5Z" fill="#2C3E50"/><path d="M10 7H12.5L14 9V11H10V7Z" fill="#2C3E50"/><circle cx="3.5" cy="12.5" r="1.3" fill="#1A252F"/><circle cx="8" cy="12.5" r="1.3" fill="#1A252F"/><circle cx="12" cy="12.5" r="1.3" fill="#1A252F"/><path d="M5.5 1.5V7.5M5.5 7.5L3.3 5.3M5.5 7.5L7.7 5.3" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <div class="custom-option" onclick="selectStopType('unload')" title="Entladen">
                            <svg width="18" height="18" viewBox="0 0 15 15" fill="none"><path d="M1 5H10V11H1V5Z" fill="#2C3E50"/><path d="M10 7H12.5L14 9V11H10V7Z" fill="#2C3E50"/><circle cx="3.5" cy="12.5" r="1.3" fill="#1A252F"/><circle cx="8" cy="12.5" r="1.3" fill="#1A252F"/><circle cx="12" cy="12.5" r="1.3" fill="#1A252F"/><path d="M5.5 7.5V1.5M5.5 1.5L3.3 3.7M5.5 1.5L7.7 3.7" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <div class="custom-option" onclick="selectStopType('via')" title="Via-Punkt">
                            <svg width="18" height="18" viewBox="0 0 15 15" fill="none"><path d="M7.5 1C5.01 1 3 3.01 3 5.5C3 8.75 7.5 14 7.5 14C7.5 14 12 8.75 12 5.5C12 3.01 9.99 1 7.5 1Z" fill="#64748b"/><circle cx="7.5" cy="5.5" r="2" fill="white"/></svg>
                        </div>
                    </div>
                </div>

                <!-- 2. Kollis -->
                <div class="package-input-wrapper" title="Anzahl Kollis (z. B. 5 oder 5+3)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <input type="text" id="newAddressKoll" value="1" placeholder="1">
                </div>

                <!-- 3. Name / Koordinaten -->
                <input type="text" id="newAddressInput" placeholder="Bohus Haugesund oder Lat,Lng..." oninput="handleNewAddressInput(this)" onkeydown="handleKeyDown(event)">
            </div>
            <div id="newAddressSuggestions" class="suggestions-box"></div>
        </div>
        <button class="btn-primary" onclick="addAddress()">Stopp anfügen</button>

        <div id="gmapLinkContainer"></div>
        
        <div class="status-box">
            <strong>Status:</strong> <span id="statusText">Bereit. Marker bewegen oder Stopps hinzufügen.</span>
        </div>

        <div id="output" class="stop-list">
            <span style="color:var(--text-muted);">Noch keine Route berechnet.</span>
        </div>
    </div>

    <div id="right-column">
        <div id="map-container">
            <div style="font-weight:600; font-size:0.9rem; margin-bottom:8px; color:var(--text-color);">Live-Routenkarte</div>
            <div id="map"></div>
        </div>

        <div id="debugBox" class="debug-box">
            [SYSTEM] Routenplanungssystem einsatzbereit.
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    function computeStopLabels(stopsList) {
        const labels = new Array(stopsList.length);
        let globalSeq = 1;

        stopsList.forEach((item, idx) => {
            if (!item) return;
            if (item.type === 'via') {
                labels[idx] = 'VIA';
            } else if (item.type === 'load') {
                labels[idx] = `L${globalSeq++}`;
            } else if (item.type === 'unload') {
                labels[idx] = `U${globalSeq++}`;
            }
        });

        return labels;
    }

    function parseKolliSum(val) {
        if (val === undefined || val === null || val === "") return 1;
        if (typeof val === 'number') return isNaN(val) ? 1 : val;
        const str = String(val).trim();
        if (!str) return 1;
        const parts = str.split('+');
        let total = 0;
        for (let part of parts) {
            let num = parseInt(part.trim(), 10);
            if (!isNaN(num)) {
                total += num;
            }
        }
        return total > 0 ? total : 1;
    }

    function getKolliRaw(val) {
        if (val === undefined || val === null || val === "") return "1";
        return String(val).trim();
    }

    let stationDatabase = [];

    async function loadStationDatabase() {
        try {
            const response = await fetch('https://kotlett.github.io/vdt-ruteplanlegger/stations.json');
            if (!response.ok) {
                throw new Error(`HTTP-Fehler! Status: ${response.status}`);
            }
            stationDatabase = await response.json();
            logDebug(`[DB] ${stationDatabase.length} Stationen aus stations.json geladen.`);
        } catch (error) {
            logDebug(`[DB-FEHLER] Konnte stations.json nicht laden: ${error.message}`);
        }
    }

    let currentStopType = 'unload';
    let addresses = []; 
    let depotData = { name: "VD Transport AS, Sørestrandvegen, 6220 Straumgjerde", lat: 62.3342430, lng: 6.5856790 };
    let debounceTimer = null;
    let depotDebounceTimer = null;
    let selectedNewAddress = null;
    let routeLayer = null;
    let markersLayer = L.layerGroup();
    let previewMarkerLayer = L.layerGroup();

    function saveTourToFile() {
        if (addresses.length === 0) {
            alert("Es sind keine Stopps zum Speichern vorhanden.");
            return;
        }

        const tourPayload = {
            version: "1.0",
            savedAt: new Date().toISOString(),
            depot: depotData,
            stops: addresses
        };

        const jsonString = JSON.stringify(tourPayload, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        
        const dateStr = new Date().toISOString().slice(0, 10);
        const filename = `tour_${dateStr}.tur`;

        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        logDebug(`[DATEI] Tour erfolgreich als "${filename}" gespeichert (${addresses.length} Stopps).`);
    }

    function triggerLoadTour() {
        document.getElementById('tourFileInput').click();
    }

    function handleTourFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const tourPayload = JSON.parse(e.target.result);

                if (!tourPayload || (!Array.isArray(tourPayload.stops) && !Array.isArray(tourPayload.addresses))) {
                    throw new Error("Ungültiges Dateiformat. Keine Stopps gefunden.");
                }

                if (addresses.length > 0) {
                    if (!confirm("Beim Laden der neuen Tour werden alle aktuellen Stopps überschrieben. Fortfahren?")) {
                        event.target.value = "";
                        return;
                    }
                }

                if (tourPayload.depot && typeof tourPayload.depot.lat === 'number' && typeof tourPayload.depot.lng === 'number') {
                    depotData = tourPayload.depot;
                    document.getElementById('depotInput').value = depotData.name || "";
                }

                const loadedStops = tourPayload.stops || tourPayload.addresses;
                addresses = loadedStops.map(s => ({
                    name: s.name || "Unbenannter Stopp",
                    lat: parseFloat(s.lat),
                    lng: parseFloat(s.lng),
                    type: s.type || 'unload',
                    koll: s.koll !== undefined ? s.koll : 1,
                    loaded: Boolean(s.loaded)
                }));

                updateAddressUI();
                await calculateRoute();
                logDebug(`[DATEI] Tour aus "${file.name}" geladen (${addresses.length} Stopps).`);

            } catch (err) {
                alert("Fehler beim Laden der .tur-Datei: " + err.message);
                logDebug(`[DATEI-FEHLER] ${err.message}`);
            } finally {
                event.target.value = "";
            }
        };

        reader.readAsText(file);
    }

    function getMatchedStationData(lat, lng, radiusMeters = 200) {
        for (const st of stationDatabase) {
            const distKm = getDistanceFromLatLonInKm(lat, lng, st.lat, st.lng);
            if (distKm * 1000 <= radiusMeters) {
                return st;
            }
        }
        return null;
    }

    function checkLoadingSafety(actionName) {
        const hasLoadedItems = addresses.some(a => a.loaded);
        if (hasLoadedItems) {
            return confirm(
                `⚠️ ACHTUNG: Die Beladung wurde bereits begonnen!\n\n` +
                `Eine Änderung der ${actionName} kann die LIFO-Ladefolge durcheinanderbringen.\n\n` +
                `Möchtest du trotzdem fortfahren?`
            );
        }
        return true;
    }

    function toggleStopLoadedStatus(tourIndex) {
        if (addresses[tourIndex]) {

    function normalizeScandinavianInput(str) {
        if (!str) return "";
        return str
            .replace(/[øöõȯọỏốồổỗộớờởỡợőōøǿ]/gi, 'o')
            .replace(/[æäàáâãåąāăǎǟǡǣǻȁȃạảấầẩẫậắằẳẵặǻ]/gi, 'a')
            .replace(/[üúùûűūųǔǖǘǚǜȕȗủứừửữự]/gi, 'u')
            .replace(/[éèêëēėęěȅȇẹẻẽếềểễệ]/gi, 'e')
            .replace(/[íìîïīįĭǐȉȋỉĩị]/gi, 'i');
    }

    function parseCoordinatesFromInput(inputStr) {
        if (!inputStr) return null;
        const str = inputStr.trim();
        const atMatch = str.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
        if (atMatch) {
            return { lat: parseFloat(atMatch[1]), lng: parseFloat(atMatch[2]) };
        }
        const coordPairMatch = str.match(/^(-?\d{1,2}\.\d+)[,\s]+(-?\d{1,3}\.\d+)$/);
        if (coordPairMatch) {
            return { lat: parseFloat(coordPairMatch[1]), lng: parseFloat(coordPairMatch[2]) };
        }
        return null;
    }

    function cleanAndFormatAddress(displayName, addressObj) {
        if (!displayName) return "";
        if (!addressObj) {
            let rawParts = displayName.split(',').map(p => p.trim());
            let unique = [];
            rawParts.forEach(p => {
                let lowerP = p.toLowerCase();
                if (lowerP === 'norge' || lowerP === 'norges' || lowerP === 'norway' || lowerP === 'noruega') return;
                if (!unique.some(u => u.toLowerCase() === lowerP)) {
                    unique.push(p);
                }
            });
            return unique.slice(0, 3).join(', ');
        }

        const a = addressObj;
        let name = a.company || a.amenity || a.shop || a.office || a.building || a.industrial || a.craft || a.tourism || a.historic || a.leisure || a.railway || "";
        
        if (!name && displayName) {
            let rawParts = displayName.split(',').map(p => p.trim());
            if (rawParts.length > 0) {
                let first = rawParts[0];
                let isHouseNum = (a.house_number && first === a.house_number) || /^\d+[a-zA-Z]?$/.test(first);
                let isStreet = a.road && (first.toLowerCase().includes(a.road.toLowerCase()) || a.road.toLowerCase().includes(first.toLowerCase()));
                let isCity = (a.city || a.town || a.village) && first.toLowerCase() === (a.city || a.town || a.village || "").toLowerCase();
                let isPostcode = a.postcode && first.includes(a.postcode);
                let isCountry = (a.country || "").toLowerCase() === first.toLowerCase();

                if (!isHouseNum && !isStreet && !isCity && !isPostcode && !isCountry) {
                    name = first;
                }
            }
        }

        let road = a.road || a.pedestrian || a.street || "";
        let houseNum = a.house_number || "";
        let streetPart = road ? (houseNum ? `${road} ${houseNum}` : road) : "";
        
        let postcode = a.postcode || "";
        let city = a.city || a.town || a.village || a.municipality || a.county || "";
        let cityPart = postcode ? (city ? `${postcode} ${city}` : postcode) : city;

        let country = a.country || "";
        let lowerCountry = country.toLowerCase();
        let isNorway = lowerCountry.includes("norge") || lowerCountry.includes("norway") || lowerCountry.includes("norges");
        let countryPart = (!isNorway && country) ? country : "";

        let parts = [];
        if (name && name.toLowerCase() !== city.toLowerCase()) parts.push(name);
        if (streetPart && streetPart.toLowerCase() !== name.toLowerCase()) parts.push(streetPart);
        if (cityPart) parts.push(cityPart);
        if (countryPart) parts.push(countryPart);

        if (parts.length < 2 && displayName) {
            let fallbackParts = displayName.split(',').map(p => p.trim());
            fallbackParts.forEach(p => {
                let lowerP = p.toLowerCase();
                if (lowerP === 'norge' || lowerP === 'norges' || lowerP === 'norway') return;
                if (p && !parts.some(existing => existing.toLowerCase().includes(lowerP) || lowerP.includes(existing.toLowerCase()))) {
                    parts.push(p);
                }
            });
        }

        let cleanParts = [];
        parts.forEach(p => {
            let trimmed = p.trim();
            if (trimmed && !cleanParts.some(c => c.toLowerCase() === trimmed.toLowerCase())) {
                cleanParts.push(trimmed);
            }
        });

        return cleanParts.slice(0, 3).join(', ');
    }

        }
        return `<strong>${fullName}</strong>`;
    }

            return `Punkt (${lat.toFixed(3)}, ${lng.toFixed(3)})`;
        } catch (err) { return `(${lat.toFixed(3)}, ${lng.toFixed(3)})`; }
    }

    async function addStopFromMap(lat, lng, type) {

        try {
            const resolvedName = await reverseGeocode(lat, lng);
            logGeoData(resolvedName, lat, lng);
            addresses.push({ name: resolvedName, lat: lat, lng: lng, type: type, koll: "1", loaded: false });
            updateAddressUI(); await calculateRoute();
        } catch (err) {
            let fallbackName = `Standort (${lat.toFixed(3)}, ${lng.toFixed(3)})`;
            logGeoData(fallbackName, lat, lng);
            addresses.push({ name: fallbackName, lat: lat, lng: lng, type: type, koll: "1", loaded: false });

    async function fetchSuggestions(query, boxElement, inputElement, onSelectCallback) {
        boxElement.innerHTML = "";
        const queryNorm = normalizeScandinavianInput(query).toLowerCase();
        let matches = [];

        if (stationDatabase && stationDatabase.length > 0) {
            stationDatabase.forEach(st => {
                const stNameNorm = normalizeScandinavianInput(st.name || "").toLowerCase();
                const stInfoNorm = normalizeScandinavianInput(st.info || "").toLowerCase();
                if (stNameNorm.includes(queryNorm) || stInfoNorm.includes(queryNorm)) {
                    matches.push({
                        name: st.name,
                        lat: st.lat,
                        lng: st.lng,
                        isDb: true,
                        info: st.info
                    });
                }
            });
        }

        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=no,se&addressdetails=1&extratags=1&q=${encodeURIComponent(normalizeScandinavianInput(query))}&limit=6`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data && data.length > 0) {
                const seenNames = new Set();
                data.forEach(item => {
                    let cleanDisp = cleanAndFormatAddress(item.display_name, item.address);
                    if (seenNames.has(cleanDisp)) return;
                    seenNames.add(cleanDisp);

                    if (!matches.some(m => Math.abs(m.lat - parseFloat(item.lat)) < 0.0001 && Math.abs(m.lng - parseFloat(item.lon || item.lng)) < 0.0001)) {
                        matches.push({
                            name: cleanDisp,
                            lat: parseFloat(item.lat),
                            lng: parseFloat(item.lon || item.lng),
                            isDb: false
                        });
                    }
                });
            }
        } catch (e) {}

        if (matches.length > 0) {
            matches.slice(0, 6).forEach(item => {
                const div = document.createElement('div');
                div.className = item.isDb ? 'suggestion-item db-match' : 'suggestion-item';
                div.innerHTML = item.isDb ? `⭐ <strong>${item.name}</strong> <span style="font-size:0.75rem;">(${item.info})</span>` : item.name;
                
                div.onclick = async () => {
                    inputElement.value = item.name;
                    logGeoData(item.name, item.lat, item.lng);
                    const obj = { name: item.name, lat: item.lat, lng: item.lng, type: currentStopType };
                    boxElement.innerHTML = "";
                    if (onSelectCallback) await onSelectCallback(obj);
                };
                boxElement.appendChild(div);
            });
        }
    }

    async function geocodeAddress(address) {
        const coords = parseCoordinatesFromInput(address);
        if (coords) {
            const resolvedName = await reverseGeocode(coords.lat, coords.lng);
            logGeoData(resolvedName, coords.lat, coords.lng);
            return { name: resolvedName, lat: coords.lat, lng: coords.lng };
        }

        const queryNorm = normalizeScandinavianInput(address).toLowerCase();
        for (const st of stationDatabase) {
            if (normalizeScandinavianInput(st.name || "").toLowerCase() === queryNorm || normalizeScandinavianInput(st.name || "").toLowerCase().includes(queryNorm)) {
                logGeoData(st.name, st.lat, st.lng);
                return { name: st.name, lat: st.lat, lng: st.lng };
            }
        }

        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=no,se&addressdetails=1&q=${encodeURIComponent(normalizeScandinavianInput(address))}&limit=1`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data && data.length > 0) {
                let cleanDisp = cleanAndFormatAddress(data[0].display_name, data[0].address);
                const latVal = parseFloat(data[0].lat);
                const lngVal = parseFloat(data[0].lng || data[0].lon);
                logGeoData(cleanDisp, latVal, lngVal);
                return { name: cleanDisp, lat: latVal, lng: lngVal };
            }
        } catch (e) {}
        return null;
    }

    async function addAddress() {
        const input = document.getElementById('newAddressInput');
        const kollInput = document.getElementById('newAddressKoll');
        const val = input.value.trim();
        if (val === "") return;
        
        let obj = selectedNewAddress ? selectedNewAddress : await geocodeAddress(val);
        if (obj) {
            obj.type = currentStopType;
            obj.koll = kollInput.value.trim() || "1";
            obj.loaded = false;
            logGeoData(obj.name, obj.lat, obj.lng);
            addresses.push(obj);
            input.value = ""; kollInput.value = "1";
            selectedNewAddress = null; previewMarkerLayer.clearLayers();
            document.getElementById('newAddressSuggestions').innerHTML = "";
            updateAddressUI(); await calculateRoute();
        } else { alert("Standort oder Koordinaten konnten nicht aufgelöst werden."); }
    }

    async function removeAddress(tourIndex) {
        if (!checkLoadingSafety("Löschen eines Stopps")) return;
        addresses.splice(tourIndex, 1);
        updateAddressUI(); await calculateRoute();
    }

    async function removeAllAddresses() {
        if (addresses.length === 0) return;
        if (confirm("Wirklich alle Stopps löschen?")) {
            addresses = []; 
            updateAddressUI(); 
            await calculateRoute();
        }
    }

    async function cycleStopType(tourIndex) {
        if (!addresses[tourIndex]) return;
        if (!checkLoadingSafety("Änderung des Stopp-Typs")) return;
        const currentType = addresses[tourIndex].type;
        if (currentType === 'load') addresses[tourIndex].type = 'unload';
        else if (currentType === 'unload') addresses[tourIndex].type = 'via';
        else addresses[tourIndex].type = 'load';
        updateAddressUI(); await calculateRoute();
    }

    function makeKolliEditable(event, tourIndex) {
        event.stopPropagation();
        const container = event.currentTarget;
        if (container.querySelector('input')) return;
        const rawValue = getKolliRaw(addresses[tourIndex].koll);
        container.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <input type="text" value="${rawValue}" style="width: 52px; padding: 1px 2px; font-size: 0.8rem; border: 1px solid #ef4444; border-radius: 4px; color: #ef4444; font-weight: bold; text-align: center; outline: none; background: #fff;">
        `;
        const input = container.querySelector('input');
        input.focus(); input.select();
        const save = async () => {
            let val = input.value.trim();
            if (!val) val = "1";
            addresses[tourIndex].koll = val;
            updateAddressUI(); await calculateRoute();
        };
        input.addEventListener('blur', save);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    }

    function dragStart(e, index) { draggedIndex = index; e.dataTransfer.effectAllowed = 'move'; }
    function dragEnd(e) { draggedIndex = null; }
    function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    async function drop(e, targetIndex) {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === targetIndex) return;
        if (!checkLoadingSafety("Reihenfolge per Drag & Drop")) return;
        
        const item = addresses.splice(draggedIndex, 1)[0];
        addresses.splice(targetIndex, 0, item);
        updateAddressUI(); await calculateRoute();
    }

    async function moveStop(index, direction) {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= addresses.length) return;
        if (!checkLoadingSafety("Änderung der Reihenfolge")) return;

        const item = addresses.splice(index, 1)[0];
        addresses.splice(targetIndex, 0, item);
        updateAddressUI(); 
        await calculateRoute();
    }

    function updateAddressUI() {
        const container = document.getElementById('addressListContainer');
        const clearAllBtn = document.getElementById('clearAllBtn');
        container.innerHTML = "";

        if (addresses.length === 0) {
            container.innerHTML = `<div class="empty-hint">Noch keine Stopps hinzugefügt. Nutze die Eingabe oder Rechtsklick auf die Karte.</div>`;
            if (clearAllBtn) clearAllBtn.style.display = 'none';
            return;
        } else {
            if (clearAllBtn) clearAllBtn.style.display = 'inline-block';
        }
        
        const labels = computeStopLabels(addresses);

        addresses.forEach((addr, tourIndex) => {
            let badgeHtml = getInteractiveIconHtml(addr.type, tourIndex);
            let labelText = labels[tourIndex] || 'VIA';
            
            let labelBgColor = addr.type === 'load' ? '#f59e0b' : (addr.type === 'unload' ? '#0284c7' : '#64748b');
            let colorBadge = `<span style="background-color: ${labelBgColor}; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; cursor: pointer;" title="Typ: ${addr.type} (Klicken zum Ändern)" onclick="cycleStopType(${tourIndex})">${labelText}</span>`;

            const totalKoll = parseKolliSum(addr.koll);
            const rawKoll = getKolliRaw(addr.koll);
            const kollTitle = rawKoll.includes('+') ? `Aufschlüsselung: ${rawKoll} (Klicken zum Bearbeiten)` : `Kollis: ${rawKoll} (Klicken zum Bearbeiten)`;

            let kollInfo = `
                <span class="kolli-click-area" onclick="makeKolliEditable(event, ${tourIndex})" style="display:inline-flex; align-items:center; gap:3px; color:#ef4444; font-weight:bold; cursor:pointer; padding:2px 4px; border-radius:4px;" title="${kollTitle}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <span>${totalKoll}</span>
                </span>`;

            let formattedName = formatAddressNameBold(addr.name);
            let itemClass = addr.loaded ? "address-item is-loaded" : "address-item";

            const matchedStation = getMatchedStationData(addr.lat, addr.lng, 200);
            let stationInfoHtml = "";
            if (matchedStation) {
                stationInfoHtml = `
                    <div id="station-info-${tourIndex}" class="station-matched-info" title="Station aus Datenbank erkannt">
                        <span>ℹ️ ${matchedStation.info}</span>
                    </div>
                `;
            }

            let stationBadgeHtml = matchedStation ? `<button class="station-badge-btn" onclick="toggleStationInfoBox(${tourIndex})" title="Stations-Info anzeigen/verstecken">!</button>` : "";

            let moveButtonsHtml = `
                <div class="move-buttons">
                    <button class="btn-move" onclick="moveStop(${tourIndex}, -1)" ${tourIndex === 0 ? 'disabled' : ''} title="Nach oben verschieben">▲</button>
                    <button class="btn-move" onclick="moveStop(${tourIndex}, 1)" ${tourIndex === addresses.length - 1 ? 'disabled' : ''} title="Nach unten verschieben">▼</button>
                </div>
            `;

            container.innerHTML += `
                <div class="${itemClass}" ondragover="dragOver(event)" ondrop="drop(event, ${tourIndex})">
                    <div class="address-main-row">
                        <div class="address-content">
                            <span class="drag-handle" draggable="true" ondragstart="dragStart(event, ${tourIndex})" ondragend="dragEnd(event)" title="Zum Sortieren ziehen (PC)">☰</span>
                            ${moveButtonsHtml}
                            ${badgeHtml}
                            <span class="address-text">${colorBadge} ${kollInfo} <span style="overflow:hidden; text-overflow:ellipsis; cursor:pointer;" onclick="makeAddressNameEditable(event, ${tourIndex})" title="Klicken, um den Firmennamen anzupassen">${formattedName}</span> ${stationBadgeHtml}</span>
                        </div>
                        <button class="btn-del" onclick="removeAddress(${tourIndex})" title="Löschen">×</button>
                    </div>
                    ${stationInfoHtml}
                </div>`;
        });
    }

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * (Math.PI/180), dLon = (lon2 - lon1) * (Math.PI/180);
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function confirmAndAutoOptimize() {
        if (addresses.length <= 1) {
            alert("Mindestens 2 Stopps für eine automatische Optimierung erforderlich.");
            return;
        }
        
        const hasLoadedItems = addresses.some(a => a.loaded);
        if (!checkLoadingSafety("automatischen Routenoptimierung")) return;
        
        if (hasLoadedItems || confirm("Möchtest du die Reihenfolge wirklich automatisch optimieren lassen?")) {
            autoSortRoute();
        }
    }

    async function autoSortRoute() {
        if (addresses.length === 0) return;
        let pool = [...addresses], sorted = [], current = depotData;
        while (pool.length > 0) {
            let nearestIdx = 0, minDist = Infinity;
            pool.forEach((pt, idx) => {
                const dist = getDistanceFromLatLonInKm(current.lat, current.lng, pt.lat, pt.lng);
                if (dist < minDist) { minDist = dist; nearestIdx = idx; }
            });
            sorted.push(pool.splice(nearestIdx, 1)[0]);
            current = sorted[sorted.length - 1];
        }
        addresses = sorted;
        updateAddressUI(); await calculateRoute();
    }

    async function calculateRoute() {
        const statusEl = document.getElementById('statusText');
        statusEl.innerText = "Berechne Route..."; statusEl.className = "pulsing";
        markersLayer.clearLayers(); previewMarkerLayer.clearLayers();

        try {
            const depotMatch = getMatchedStationData(depotData.lat, depotData.lng, 200);
            let depotPopupText = `<b>Start:</b><br>${depotData.name}`;
            if (depotMatch) {
                depotPopupText += `<br><span style="color:#0369a1; font-size:0.8rem;">ℹ️ ${depotMatch.info}</span>`;
            }

            const depotMarker = L.marker([depotData.lat, depotData.lng], { icon: createMarkerIcon('Start', '#0f172a'), draggable: true }).addTo(markersLayer);
            depotMarker.bindPopup(depotPopupText);
            
            depotMarker.on('dragend', async function(e) {
                const pos = e.target.getLatLng();
                depotData.lat = pos.lat; depotData.lng = pos.lng;
                depotData.name = await reverseGeocode(pos.lat, pos.lng);
                document.getElementById('depotInput').value = depotData.name;
                logGeoData(depotData.name, pos.lat, pos.lng);
                updateAddressUI(); await calculateRoute();
            });

            const validItems = addresses.filter(s => s && !isNaN(s.lat) && !isNaN(s.lng));
            const validItemLabels = computeStopLabels(validItems);

            validItems.forEach((item, idx) => {
                let labelText = validItemLabels[idx] || 'VIA';
                let labelBgColor = item.type === 'load' ? '#f59e0b' : (item.type === 'unload' ? '#0284c7' : '#64748b');
                let iconMarker = createMarkerIcon(labelText, labelBgColor);
                let labelTypeStr = item.type === 'load' ? 'Laden' : (item.type === 'unload' ? 'Entladen' : 'Via-Punkt');

                const itemMatch = getMatchedStationData(item.lat, item.lng, 200);
                const itemTotalKoll = parseKolliSum(item.koll);
                const itemRawKoll = getKolliRaw(item.koll);
                let popupHtml = `<b>${labelTypeStr} (${labelText}):</b><br>${item.name}<br>Kollis: ${itemTotalKoll}` + (itemRawKoll.includes('+') ? ` (${itemRawKoll})` : '');
                if (itemMatch) {
                    popupHtml += `<br><span style="color:#0369a1; font-size:0.8rem;">ℹ ${itemMatch.info}</span>`;
                }
                popupHtml += `<br><button class="map-popup-btn" style="background:#ef4444; margin-top:6px;" onclick="removeAddress(${idx}); map.closePopup();">Stopp entfernen</button>`;

                const m = L.marker([item.lat, item.lng], { icon: iconMarker, draggable: true }).addTo(markersLayer);
                m.bindPopup(popupHtml);
                
                m.on('dragend', async function(event) {
                    if (!checkLoadingSafety("Verschieben eines Markers")) {
                        updateAddressUI();
                        calculateRoute();
                        return;
                    }
                    const newPos = event.target.getLatLng();
                    addresses[idx].lat = newPos.lat; addresses[idx].lng = newPos.lng;
                    addresses[idx].name = await reverseGeocode(newPos.lat, newPos.lng);
                    logGeoData(addresses[idx].name, newPos.lat, newPos.lng);
                    updateAddressUI(); await calculateRoute();
                });
            });

            const gmapContainer = document.getElementById('gmapLinkContainer');
            const actualStops = validItems.filter(i => i.type !== 'via');

            if (validItems.length === 0) {
                map.setView([depotData.lat, depotData.lng], 11);
                if (routeLayer) map.removeLayer(routeLayer);
                document.getElementById('output').innerHTML = `<span style="color:var(--text-muted);">Füge Stopps hinzu, um die Route zu berechnen.</span>`;
                gmapContainer.innerHTML = ""; statusEl.innerText = "Bereit."; statusEl.className = "";
                return;
            }

            const allWaypoints = [depotData, ...validItems];
            const coordsString = allWaypoints.map(wp => `${wp.lng},${wp.lat}`).join(';');
            const radiusesStr = allWaypoints.map(() => '500').join(';');

            const url = `https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson&radiuses=${radiusesStr}&continue_straight=true`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.code === "Ok" && data.routes && data.routes.length > 0) {
                const route = data.routes[0];
                if (routeLayer) map.removeLayer(routeLayer);
                routeLayer = L.geoJSON(route.geometry, { style: { color: '#0284c7', weight: 6, opacity: 0.85 } }).addTo(map);

                if (routeLayer.getBounds().isValid()) {
                    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
                }

                let gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${depotData.lat},${depotData.lng}&travelmode=driving`;
                if (actualStops.length === 1) gmapsUrl += `&destination=${actualStops[0].lat},${actualStops[0].lng}`;
                else if (actualStops.length > 1) {
                    gmapsUrl += `&destination=${actualStops[actualStops.length - 1].lat},${actualStops[actualStops.length - 1].lng}`;
                    gmapsUrl += `&waypoints=${actualStops.slice(0, -1).map(s => `${s.lat},${s.lng}`).join('|')}`;
                }

                const distKm = (route.distance / 1000).toFixed(1);
                const durationHours = (route.duration / 3600).toFixed(1);

                gmapContainer.innerHTML = `
                    <div class="route-summary-card">
                        <div>
                            <strong>Gesamtstrecke:</strong> ${distKm} km | <strong>Zeit:</strong> ${durationHours} Std.
                        </div>
                        <a class="gmaps-icon-link" href="${gmapsUrl}" target="_blank" title="Route in Google Maps öffnen">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                            </svg>
                        </a>
                    </div>
                `;

                let nonViaStops = validItems.filter(i => i.type !== 'via');
                let displayStops = [...nonViaStops].reverse();

                let html = `<strong>Beladereihenfolge (LIFO):</strong><br><ol style="margin: 6px 0 6px 20px; padding: 0;">`;
                
                displayStops.forEach((stop) => {
                    let validIndex = validItems.indexOf(stop);
                    let badgeTxt = validItemLabels[validIndex] || 'VIA';
                    let badgeBg = stop.type === 'load' ? '#f59e0b' : '#0284c7';
                    let typeBadgeHtml = `<span style="background-color: ${badgeBg}; color: white; padding: 1px 5px; border-radius: 3px; font-size: 0.75rem; font-weight: bold;">${badgeTxt}</span>`;
                    
                    let addrIndex = addresses.indexOf(stop);
                    let actionTooltipText = stop.type === 'load' ? (stop.loaded ? 'Als NICHT entladen markieren' : 'Als entladen markieren') : (stop.loaded ? 'Als ungeladen markieren' : 'Als beladen markieren');
                    let loadedCheck = stop.loaded 
                        ? `<span style="color:var(--success-color); font-weight:bold; margin-right:4px; cursor:pointer;" onclick="toggleStopLoadedStatus(${addrIndex})" title="${actionTooltipText}">✔</span>` 
                        : `<span style="color:var(--text-muted); font-weight:normal; margin-right:4px; cursor:pointer;" onclick="toggleStopLoadedStatus(${addrIndex})" title="${actionTooltipText}">○</span>`;

                    const totalKoll = parseKolliSum(stop.koll);
                    const rawKoll = getKolliRaw(stop.koll);
                    const kollTitle = rawKoll.includes('+') ? `Aufschlüsselung: ${rawKoll} (Klicken zum Bearbeiten)` : `Kollis: ${rawKoll} (Klicken zum Bearbeiten)`;

                    let kollBadge = `
                        <span class="kolli-click-area" onclick="makeKolliEditable(event, ${addrIndex})" style="display:inline-flex; align-items:center; gap:3px; color:#ef4444; font-weight:bold; cursor:pointer; padding:2px 4px; border-radius:4px;" title="${kollTitle}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                            <span>${totalKoll}</span>
                        </span>`;

                    let formattedName = formatAddressNameBold(stop.name);

                    const matchedStation = getMatchedStationData(stop.lat, stop.lng, 200);
                    let stationInfoHtml = "";
                    let outputStationBadgeHtml = "";
                    if (matchedStation) {
                        outputStationBadgeHtml = ` <button class="station-badge-btn" onclick="toggleOutputStationInfoBox(${addrIndex})" title="Stations-Info anzeigen/verstecken">!</button>`;
                        stationInfoHtml = `
                            <div id="output-station-info-${addrIndex}" class="station-matched-info" title="Station aus Datenbank erkannt">
                                <span>ℹ️ ${matchedStation.info}</span>
                            </div>
                        `;
                    }

                    html += `<li style="margin-bottom: 6px;">${loadedCheck}${typeBadgeHtml} ${kollBadge} ${formattedName}${outputStationBadgeHtml}${stationInfoHtml}</li>`;
                });

                html += `</ol>`;

                document.getElementById('output').innerHTML = html;
            } else {
                logDebug("OSRM Warnung: Route konnte nicht berechnet werden.");
            }
        } catch (e) {
            logDebug("Berechnungsfehler: " + e.message);
        } finally {
            statusEl.innerText = "Bereit."; statusEl.className = "";
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await loadStationDatabase();
        const initialVal = document.getElementById('depotInput').value.trim();
        const depot = await geocodeAddress(initialVal);
        if (depot) { 
            depotData = depot; 
            document.getElementById('depotInput').value = depotData.name;
            map.setView([depot.lat, depot.lng], 11); 
            await calculateRoute(); 
        }
    });
</script>
